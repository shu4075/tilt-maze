<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10141c">
  <title>転がし迷路に参加</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 参加：ニックネーム入力 -->
  <section id="screen-join" class="screen join">
    <h1>みんなで傾ける<br>転がし迷路</h1>
    <form id="join-form" class="join-form" autocomplete="off">
      <label>
        ルームコード
        <input id="room-input" name="room" maxlength="4" inputmode="text"
               autocapitalize="characters" placeholder="ABCD" required>
      </label>
      <label>
        ニックネーム
        <input id="nickname-input" name="nickname" maxlength="12" placeholder="12文字まで" required>
      </label>
      <button id="join-button" type="submit">参加する</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- 操作：大きな矢印・タッチパッド・コンパス -->
  <section id="screen-control" class="screen control" hidden>
    <header class="control-head">
      <div class="badge"><span class="dot" id="me-color"></span><span id="me-name"></span></div>
      <div class="phase" id="phase-label">スタート待ち</div>
    </header>

    <div class="status-row">
      <div class="majority" id="majority" data-state="none">-</div>
      <div class="compass" aria-label="全体の向き">
        <span class="compass-cross"></span>
        <span class="compass-dot" id="compass-dot"></span>
      </div>
    </div>

    <div class="pad" id="pad" data-mode="touch">
      <svg class="arrow" id="arrow" viewBox="-50 -50 100 100" aria-hidden="true">
        <circle class="arrow-neutral" r="14"></circle>
        <path class="arrow-shape" d="M 40 0 L 6 -26 L 6 -11 L -34 -11 L -34 11 L 6 11 L 6 26 Z"></path>
      </svg>
      <span class="pad-label up">▲</span>
      <span class="pad-label down">▼</span>
      <span class="pad-label left">◀</span>
      <span class="pad-label right">▶</span>
    </div>

    <p class="legend"><span class="key mine"></span>あなたの方向　<span class="key major"></span>いまの多数派</p>

    <div class="mode-row">
      <div class="segmented" role="radiogroup" aria-label="操作方法">
        <button type="button" id="mode-touch" role="radio" aria-checked="true">ボタンで操作</button>
        <button type="button" id="mode-sensor" role="radio" aria-checked="false">傾けて操作（おまけ）</button>
      </div>
      <button type="button" id="calibrate" class="small-btn" hidden>今の角度を水平にする</button>
      <p class="hint" id="mode-hint"></p>
    </div>

    <div class="countdown" id="countdown" hidden></div>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen result" hidden>
    <div class="result-title" id="res-title">クリア！</div>
    <div class="result-time" id="res-time">0.00 秒</div>
    <div class="result-rate">
      <span class="label">あなたの多数派率</span>
      <span id="res-rate">-</span>
    </div>
    <div class="result-award" id="res-award" hidden></div>
    <p class="muted">次のゲームが始まるまで待っててね</p>
  </section>

  <!-- 横向きにしたときの案内（縦向きで使ってもらう） -->
  <div class="rotate-hint">スマホを縦向きにしてね</div>

  <div id="conn-status" class="conn-status" hidden>再接続しています…</div>

  <script type="module" src="./play.js"></script>
</body>
</html>
